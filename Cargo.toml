[package]
name = "keen"
version = "0.5.1"
edition = "2021"
description = "Rust reimplementation of Commander Keen 4, 5 and 6 (requires the original data files)"

[dependencies]
rodio = { version = "0.21", default-features = false, features = ["playback", "vorbis", "wav", "flac", "mp3"] }
oplon = "1.0"
png = "0.17"
rustysynth = "1.3"
gilrs = "0.11"
winit = "0.30"
softbuffer = "0.4"

# Pro Controller driver (src/engine/procon.rs)
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
png = "0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false

[workspace]
members = [".", "editor"]
