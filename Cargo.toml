[package]
name = "keen"
version = "0.5.0"
edition = "2021"
description = "Rust reimplementation of Commander Keen 4, 5 and 6 (requires the original data files)"

[dependencies]
oplon = "1.0"
png = "0.17"
rustysynth = "1.3"

# window, gamepads and audio output (in the browser: src/engine/sys_web.rs)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "0.21", default-features = false, features = ["playback", "vorbis", "wav", "flac", "mp3"] }
gilrs = "0.11"
winit = "0.30"
softbuffer = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

# Pro Controller driver (src/engine/procon.rs)
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
png = "0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false

[workspace]
members = [".", "editor", "web"]
