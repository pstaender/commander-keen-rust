# Builds keen4, keen5 and keen6 for Linux, Windows and macOS when a release
# is published and attaches the archives to it.
#
# The original game files are downloaded from archive.org (cached for half
# a year) to run the tests and replay the original demos with each build.
# Only Keen 4 (the shareware episode) is bundled (data/KEEN4 next to the
# binaries, inside "Keen 4.app" on macOS), so keen4 is playable right away; Keen 5 and 6 (commercial) are
# never bundled or uploaded as artifacts.
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  game-data:
    name: Original game data
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      # one cache key per half year, so archive.org is asked at most twice a year
      - name: Cache key
        id: key
        run: echo "key=keen-data-v2-$(date -u +%Y)-h$(( ($(date -u +%-m) + 5) / 6 ))" >> "$GITHUB_OUTPUT"

      # the build jobs restore this cache on every OS (no artifact)
      - name: Cache the original game files
        id: cache
        uses: actions/cache@v6
        with:
          path: gamedata
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

      - name: Download from archive.org
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zips
          dl() { [ -s "zips/$2" ] || curl -sSfL --retry 3 -o "zips/$2" "$1"; }
          dl https://archive.org/download/keen-4/Keen4.zip keen4.zip
          dl https://archive.org/download/keen5/keen5.zip keen5.zip
          dl https://archive.org/download/keen-6/Keen6.zip keen6.zip

      - name: Unpack into KEEN4, KEEN5, KEEN6
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for n in 4 5 6; do
            tmp=$(mktemp -d)
            unzip -q "zips/keen$n.zip" -d "$tmp"
            # the zips differ in layout: take the directory holding EGAGRAPH.CKn
            src=$(dirname "$(find "$tmp" -iname "EGAGRAPH.CK$n" | head -n1)")
            mkdir -p "gamedata/KEEN$n"
            cp "$src"/* "gamedata/KEEN$n/"
            ls -l "gamedata/KEEN$n"
          done

      # GeneralUser GS (free to redistribute, see its LICENSE.txt) for the
      # MIDI music, pinned to a commit and checked
      - name: Download the SoundFont
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/684543d5e5efaef08d02be50dcda8d552478fa60
          curl -sSfL --retry 3 -o gamedata/GeneralUser-GS.sf2 "$base/GeneralUser-GS.sf2"
          curl -sSfL --retry 3 -o gamedata/GeneralUser-GS-LICENSE.txt "$base/documentation/LICENSE.txt"
          echo "9575028c7a1f589f5770fccc8cff2734566af40cd26ed836944e9a5152688cfe  gamedata/GeneralUser-GS.sf2" | sha256sum -c

  build:
    name: ${{ matrix.name }}
    needs: game-data
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            exe: ""
          - name: windows-x86_64
            os: windows-latest
            exe: .exe
          - name: macos-universal
            os: macos-latest
            exe: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Restore the original game files
        uses: actions/cache/restore@v6
        with:
          path: gamedata
          key: ${{ needs.game-data.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - run: cp -r gamedata/KEEN4 gamedata/KEEN5 gamedata/KEEN6 .

      - name: Build
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo build --release -p keen --target aarch64-apple-darwin
            cargo build --release -p keen --target x86_64-apple-darwin
            mkdir -p target/release
            for e in 4 5 6; do
              lipo -create -output target/release/keen$e \
                target/aarch64-apple-darwin/release/keen$e \
                target/x86_64-apple-darwin/release/keen$e
            done
          else
            cargo build --release -p keen
          fi

      - name: Tests (with the original data)
        run: cargo test --release -p keen

      - name: Replay the original demos
        run: |
          for e in 4 5 6; do
            for d in 0 1 2 3; do
              KEEN_TRACE="trace-$e-$d.txt" ./target/release/keen$e${{ matrix.exe }} \
                --data KEEN$e --headless --nosound --demo $d
              [ -s "trace-$e-$d.txt" ] || { echo "keen$e demo $d produced no trace"; exit 1; }
              echo "keen$e demo $d: $(wc -l < trace-$e-$d.txt) trace lines"
            done
          done

      - name: Package
        id: pkg
        run: |
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          name="commander-keen-rust-$tag-${{ matrix.name }}"
          mkdir "$name"
          cp README.md "$name/"
          # Keen 4 is shareware: bundle it so keen4 runs right away. Keen 5
          # and 6 data go to data/KEEN5, data/KEEN6 (data/, since a KEEN4
          # directory would clash with the keen4 binary on case-insensitive
          # file systems)
          mkdir -p "$name/data/KEEN4" "$name/data/KEEN5" "$name/data/KEEN6"
          cp KEEN4/AUDIO.CK4 KEEN4/EGAGRAPH.CK4 KEEN4/GAMEMAPS.CK4 KEEN4/KEEN4*.EXE "$name/data/KEEN4/"
          if [ "$RUNNER_OS" = macOS ]; then
            # app bundles with the icon; Keen 4's data inside its bundle
            python3 -I tools/make_icns.py icon.png keen.icns
            tools/make_app.sh "Keen 4" target/release/keen4 keen.icns "$name" "$name/data/KEEN4" \
              gamedata/GeneralUser-GS.sf2 gamedata/GeneralUser-GS-LICENSE.txt
            tools/make_app.sh "Keen 5" target/release/keen5 keen.icns "$name"
            tools/make_app.sh "Keen 6" target/release/keen6 keen.icns "$name"
            rm -r "$name/data/KEEN4"
            echo "bin=$name/Keen 4.app/Contents/MacOS/keen4" >> "$GITHUB_OUTPUT"
          else
            cp gamedata/GeneralUser-GS.sf2 gamedata/GeneralUser-GS-LICENSE.txt "$name/data/"
            for e in 4 5 6; do cp "target/release/keen$e${{ matrix.exe }}" "$name/"; done
            echo "bin=$name/keen4${{ matrix.exe }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Put the original files of Keen 5 / Keen 6 into KEEN5 / KEEN6." > "$name/data/README.txt"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$name.tar.gz" "$name"
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the packaged keen4 starts without --data
        run: |
          exe="$PWD/${{ steps.pkg.outputs.bin }}"
          cd "$RUNNER_TEMP" && "$exe" --headless --nosound --demo 0

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.pkg.outputs.file }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.pkg.outputs.file }}" --clobber
